packages:
  - apps/*
  - packages/*

# Colyseus uses uWebSockets.js from its upstream Git repository. The generated
# lockfile records its immutable source revision.
allowBuilds:
  esbuild: true
  msgpackr-extract: true

blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - '@colyseus/sdk@0.18.3'
  - colyseus@0.18.7
